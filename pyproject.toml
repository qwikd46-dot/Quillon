[project]
name = "quillon"
version = "1.0.0"
description = "Quillon — Browser for Safe Browsing"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "cryptography>=41.0.0",
    "keyring>=25.0",
    "adblock>=0.6.0",
    "mitmproxy>=12.2.3",
]

[project.optional-dependencies]
test = ["websockets>=12.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
quillon = ["templates/*.html", "templates/static/**", "*.png"]