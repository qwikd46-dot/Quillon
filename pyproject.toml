[project]
name = "bfsb"
version = "1.0.0"
description = "BFSB — Browser for Safe Browsing"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"