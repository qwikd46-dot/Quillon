<!-- Quillon loading screen. Rendered while the Quillon local server is starting up.
     The JS at the bottom polls 127.0.0.1:8889/health (Quillon's local server) and,
     once it returns 200, polls 127.0.0.1:8888/healthz (SearXNG). When both are
     up, it redirects to the home URL, which the Quillon main window re-renders
     as quillon_combined.html.

     Color palette is pulled verbatim from quillon/ui/styles.py:
       BG_0     #0a0a12   window background
       BG_1     #11111a   card background
       BG_3     #1f1f2e   progress track
       TEXT_0   #f0f0f5   title
       TEXT_2   #7a7a8a   subtitle
       PURPLE_1 #5b5bf0   progress fill start — SAME as the browser
                          chrome's NativeProgressBar (browser_chrome.py)
       PURPLE_2 #8b5cf6   progress fill end / glow — SAME as NativeProgressBar
       ACCENT   #7c6af5   logo mark + logo box tint (box is a lighter
                          translucent wash of the same purple)
       BORDER_1 #2a2a3e   card border
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quillon — Loading Services</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    background: #0a0a12;     /* BG_0 */
    color: #f0f0f5;          /* TEXT_0 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 480px;
    max-width: 92vw;
    background: #11111a;     /* BG_1 */
    border: 1px solid #2a2a3e;  /* BORDER_1 */
    border-radius: 12px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    padding: 48px 40px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: 80px;
    height: 80px;
    border-radius: 18px;
    /* Same purple as the logo mark, but a LIGHTER translucent wash */
    background: rgba(124, 106, 245, 0.14);
    border: 1px solid rgba(124, 106, 245, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    animation: spin 2.4s linear infinite;
  }
  .logo-mark {
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: #7c6af5;          /* app purple — matches the UI accent */
    text-shadow: 0 0 18px rgba(124, 106, 245, 0.45);
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    color: #f0f0f5;          /* TEXT_0 */
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    color: #7a7a8a;          /* TEXT_2 */
    letter-spacing: 0.04em;
    margin-bottom: 28px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .progress {
    width: 320px;
    max-width: 100%;
    height: 4px;
    background: #1f1f2e;     /* BG_3 */
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress::before {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 100%;
    /* Exact same gradient as the browser chrome's NativeProgressBar:
       #5b5bf0 → #8b5cf6 (see quillon/ui/browser_chrome.py). */
    background: linear-gradient(
      90deg,
      rgba(91, 91, 240, 0)   0%,
      rgba(91, 91, 240, 0.75) 40%,
      rgba(139, 92, 246, 0.95) 60%,
      rgba(139, 92, 246, 0)  100%
    );
    animation: slide 1.6s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.7);  /* glow, like the chrome bar */
  }
  .status {
    margin-top: 18px;
    font-size: 12px;
    color: #7a7a8a;          /* TEXT_2 */
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
    min-height: 1.2em;
    text-align: center;
  }
  .status .ok { color: #7c6af5; }   /* app purple */
  .status .wait { color: #7a7a8a; } /* TEXT_2 */

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1.0;  }
  }
  @keyframes slide {
    0%   { left: -40%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" role="status" aria-live="polite">
      <div class="logo" aria-hidden="true">
        <span class="logo-mark">B</span>
      </div>
      <div class="title">Quillon</div>
      <div class="subtitle">Loading Services&hellip;</div>
      <div class="progress" aria-hidden="true"></div>
      <div class="status" id="status">Initializing&hellip;</div>
    </div>
  </div>

  <script>
    // Poll the two services we depend on. The local Quillon server (8889) is
    // required for the home page; SearXNG (8888) is the metasearch backend.
    // When both are healthy, redirect to the home URL. The Qt side ALSO
    // watches both health flags as a safety net, so even if this script
    // fails, the home page appears once the services are up.
    (function () {
      var statusEl = document.getElementById('status');
      var done = false;
      var t0 = Date.now();
      function setStatus(text, cls) {
        statusEl.innerHTML = '<span class="' + (cls || 'wait') + '">' + text + '</span>';
      }
      function poll(url, onUp) {
        return fetch(url, { method: 'GET', cache: 'no-store' })
          .then(function (r) { if (r.ok) onUp(); })
          .catch(function () { });
      }
      function goHome() {
        if (done) return;
        done = true;
        setStatus('All services ready. Opening browser...', 'ok');
        // ABSOLUTE URL: this page is loaded via file://, so a relative
        // '/' would resolve to the filesystem, not the local server.
        setTimeout(function () {
          window.location.replace('http://127.0.0.1:8889/');
        }, 400);
      }
      function tick() {
        if (done) return;
        poll('http://127.0.0.1:8889/health', function () {
          if (done) return;
          setStatus('Local server ready. Checking SearXNG...');
          poll('http://127.0.0.1:8888/healthz', function () {
            if (done) return;
            goHome();
          });
        });
        // Hard fallback: never leave the user stuck on this screen.
        if (Date.now() - t0 > 90000) goHome();
        if (!done) setTimeout(tick, 500);
      }
      // Small initial delay so the loading screen doesn't flash.
      setTimeout(tick, 600);
    })();
  </script>
</body>
</html>
