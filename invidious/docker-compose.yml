version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bfsb-invidious-postgres
    environment:
      POSTGRES_USER: invidious
      POSTGRES_PASSWORD: invidious
      POSTGRES_DB: invidious
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invidious"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bfsb-invidious-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  invidious:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bfsb-invidious
    volumes:
      - ./config/config.yml:/config.yml:ro
      - ./data:/invidious/data
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/comments/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  redis_data: