#########################################
#  Invidious config
#########################################

##
## Instance settings
##
instance_name: "BFSB Invidious"
description: "Privacy-friendly YouTube frontend for BFSB browser"
contact_email: ""
default_locale: "en"
languages: ["en", "es", "fr", "de", "ru", "zh", "ja", "ko"]

# HTTPS
https_only: true
domain: "localhost"
external_port: 3003
enable_tor: true
enable_dark_mode: true
enable_open_search: true

# Player
default_quality: "720p"

# Feed
feed: true
feed_max_items: 50

# Trending
trending: true

# Subscriptions
user_subscriptions: true
user_history: true

# Captcha
captcha:
  enabled: false

# Rate limiting
ratelimit:
  enabled: true
  limit: 100
  window: 60

# Advertising (none)
advertisement:
  enabled: false

# HMAC key for CSRF tokens, cookies and pubsub subscriptions verification
# Generate with: openssl rand -hex 20
hmac_key: "3ab631f77811fa0e64f87d4be837451af3ff2eac"


#########################################
#  Database
#########################################

db:
  user: invidious
  password: invidious
  host: postgres
  port: 5432
  dbname: invidious


#########################################
#  Redis
#########################################

redis:
  host: redis
  port: 6379


#########################################
#  Features
#########################################

popular_enabled: true
statistics_enabled: false


#########################################
#  Users and accounts
#########################################

registration_enabled: true
login_enabled: true
captcha_enabled: false

# Admin users (empty = none)
admins: []

# Enable user notifications
enable_user_notifications: true


#########################################
#  Background jobs
#########################################

channel_threads: 1
full_refresh: false
feed_threads: 1

jobs:
  clear_expired_items:
    enable: true
  refresh_channels:
    enable: true
  refresh_feeds:
    enable: true